services:
  - type: web
    name: productiondeck
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: productiondeck-data
      mountPath: /data
      sizeGB: 10
