<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Set up your Productiondeck login</title><link rel="icon" href="/brand/tatamata-icon.svg"><link rel="stylesheet" href="/style.css"></head><body><main class="account-setup-page"><a href="/" aria-label="Productiondeck home"><img src="/brand/tatamata-horizontal.svg" width="220" alt="Tatamata"></a><p class="eyebrow">YOUR PRIVATE LIBRARY ACCOUNT</p><h1>Choose your password.</h1><p>Your administrator shared this one-use link with you. Choose a password for Productiondeck; your email account password does not change.</p><form id="account-setup-form"><label>New library password<input name="password" type="password" minlength="12" maxlength="1024" required autocomplete="new-password"></label><label>Repeat password<input name="repeat" type="password" minlength="12" maxlength="1024" required autocomplete="new-password"></label><label class="account-show-password"><input type="checkbox" id="setup-show-password"> Show passwords</label><p id="account-setup-error" role="alert"></p><p id="account-setup-status" role="status"></p><button class="primary">Save password & sign in</button></form><p>At least 12 characters. Never forward this private link.</p><a class="text-button" href="/#browse">Back to sign in</a></main><script src="/account-setup.js" defer></script></body></html>
