<svg xmlns="http://www.w3.org/2000/svg" width="850" height="490" viewBox="0 0 850 490" role="img" aria-labelledby="title description"><title id="title">Tatamata — Udhëzues për fotografitë e kastingut</title><desc id="description">Fotografi përballë, profil dhe trup i plotë.</desc><rect width="850" height="490" rx="16" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#293920"><text x="35" y="40" font-size="14" letter-spacing="3">TATAMATA / CASTING</text><text x="35" y="83" font-size="27" font-weight="bold">Si t’i përgatitësh fotografitë</text><text x="35" y="113" font-size="16" fill="#657458">Rekomandojmë këto pamje. Mund të dërgosh 1–4 fotografi të qarta.</text><rect x="35" y="140" width="245" height="282" rx="12" fill="#f5f7f0" stroke="#dce2d3"/><g transform="translate(57 137)" fill="none" stroke="#3d4d33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M61 90C61 41 139 41 139 90v35c0 28-21 51-39 51s-39-23-39-51Z" fill="#fff"/><path d="M61 105c-17-8-17 24 1 27m77-27c17-8 17 24-1 27M77 168v25m46-25v25M77 193l-35 20m81-20 35 20"/><path d="M73 98q10-6 19 0m16 0q10-6 19 0M76 108q7-5 14 0m20 0q7-5 14 0M99 112l-4 22h10M87 149q13 7 26 0"/><circle cx="83" cy="109" r="2.5" fill="#3d4d33" stroke="none"/><circle cx="117" cy="109" r="2.5" fill="#3d4d33" stroke="none"/></g><text x="157" y="386" text-anchor="middle" font-size="17" font-weight="bold">1. Përballë</text><text x="157" y="408" text-anchor="middle" font-size="13" fill="#657458">Fytyra drejt kamerës.</text><rect x="305" y="140" width="245" height="282" rx="12" fill="#f5f7f0" stroke="#dce2d3"/><g transform="translate(327 137)" fill="none" stroke="#3d4d33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M67 192c8-22 9-39-1-54-34-48-6-90 38-87 28 2 42 20 39 50l-2 15 16 22q2 5-12 7l-1 9-7 3 6 4c-1 17-17 22-35 17l-8-3v19l32 20" fill="#fff"/><path d="M95 116c-15-14-27 1-18 15l12 7m35-31q8-4 17-1m-15 11 13-1m-38 59q8-8 11-20M67 192l-28 23"/><circle cx="133" cy="116" r="2" fill="#3d4d33" stroke="none"/></g><text x="427" y="386" text-anchor="middle" font-size="17" font-weight="bold">2. Profili</text><text x="427" y="408" text-anchor="middle" font-size="13" fill="#657458">Fytyra plotësisht anash.</text><rect x="575" y="140" width="245" height="282" rx="12" fill="#f5f7f0" stroke="#dce2d3"/><g transform="translate(597 137)" fill="none" stroke="#3d4d33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="100" cy="40" r="15" fill="#fff"/><path d="M94 55v8m12-8v8m-12 0L77 70l-13 55 9 4 15-39v44m18-71 17 7 13 55-9 4-15-39v44" fill="#fff"/><path d="M88 132h24l7 76-11 1-8-59-8 59-11-1Z" fill="#fff"/><path d="m81 208-7 8q-2 4 16 2l2-9m16 0 2 9q18 2 16-2l-7-8M91 38h1m16 0h1m-13 8q4 3 8 0M88 132h24M58 20v204m-5-199 5-5 5 5m-10 194 5 5 5-5"/><path d="M45 224h110" stroke="#cbd5bf"/></g><text x="697" y="386" text-anchor="middle" font-size="17" font-weight="bold">3. Trupi i plotë</text><text x="697" y="408" text-anchor="middle" font-size="13" fill="#657458">Nga koka deri te këmbët.</text><text x="35" y="454" font-size="15">Fotografi të fundit · Dritë e mirë · Sfond i thjeshtë · Pa filtra ose syze dielli</text></g></svg>
